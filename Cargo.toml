[package]
name = "pi-agent"
version = "0.1.0"
edition = "2021"
description = "MindOS personal intelligence node for controlled files, projects, sync and AI harness sessions"
repository = "https://github.com/mushuanli/pi-agent"
homepage = "https://github.com/mushuanli/pi-agent"
readme = "README.md"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
rustix = { version = "1", features = ["fs", "process"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
rusqlite = { version = "0.31", features = ["bundled", "serialize"] }
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace]

[[test]]
name = "sync"
path = "tests/sync/main.rs"

[features]
sync-fault-injection = []
